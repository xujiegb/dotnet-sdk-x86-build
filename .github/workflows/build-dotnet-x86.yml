name: Build .NET SDK (linux-x86)

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet
      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main
      branding:
        description: 'SDK branding'
        required: true
        type: choice
        options:
          - unstable
          - preview
          - release
        default: preview
      release:
        description: 'publish release'
        type: boolean
      apphost_version:
        description: '手动指定 Microsoft.NETCore.App.Host.linux-x86 的版本号（留空则尝试自动探测，探测失败会报错要求手填）'
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux
            libc: glibc
            docker_tag: azurelinux-3.0-net10.0-cross-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Show workflow inputs
      run: |
        echo "Workflow inputs:"
        echo "fork: ${{ inputs.fork }}"
        echo "branch: ${{ inputs.branch }}"
        echo "branding: ${{ inputs.branding }}"
        echo "release: ${{ inputs.release }}"
        echo "apphost_version (手动指定，可为空): ${{ inputs.apphost_version }}"

    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Prepare local NuGet feed for AppHost pack
      run: |
        # 建一个空的本地 feed 目录，第一趟构建时它是空的（不影响，反正第一趟本来就预期失败），
        # 第二趟构建前会把打好的 apphost nupkg 放进来。
        mkdir -p ${{ github.workspace }}/local-feed

        NUGET_CONFIG="${{ github.workspace }}/dotnet/NuGet.config"
        if [ ! -f "$NUGET_CONFIG" ]; then
          echo "::error::未在预期路径找到 NuGet.config，请检查 VMR 仓库结构是否变化"
          find ${{ github.workspace }}/dotnet -maxdepth 2 -iname 'NuGet.config'
          exit 1
        fi

        # 在 <packageSources> 标签后插入本地 feed 源。
        # 容器内挂载路径是 /dotnet-local-feed（见下面 docker run 的 -v 参数）。
        sed -i 's#<packageSources>#<packageSources>\n    <add key="local-apphost-feed" value="/dotnet-local-feed" />#' "$NUGET_CONFIG"
        echo "Patched NuGet.config (相关行):"
        grep -B1 -A1 "local-apphost-feed" "$NUGET_CONFIG"

    - name: Build (pass 1 - 预期在 AppHost restore 处失败，用于提取 apphost 二进制和版本信息)
      id: build_pass1
      continue-on-error: true
      run: |
        docker run --platform linux/amd64 --rm \
          -v ${{ github.workspace }}/dotnet:/dotnet \
          -v ${{ github.workspace }}/local-feed:/dotnet-local-feed \
          -w /dotnet \
          -e ROOTFS_DIR=/crossrootfs/x86 \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e MSBUILDDISABLENODEREUSE=1 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            ./build.sh --clean-while-building --prep -sb \
              --os ${{ matrix.name }} \
              --rid ${{ matrix.name }}-x86 \
              --arch x86 \
              --branding ${{ inputs.branding }} \
              -p:OfficialBuildId=$(date +%Y%m%d).99 \
              -p:MaxCpuCount=3

    - name: Check pass 1 outcome
      run: |
        if [ "${{ steps.build_pass1.outcome }}" = "success" ]; then
          echo "第一趟构建居然直接成功了（说明这次环境本身就有 AppHost pack，或者上游已修复），后面步骤仍会正常执行，不影响结果。"
        else
          echo "第一趟构建按预期失败（用于收集 apphost 二进制），继续后续步骤。"
        fi

    - name: Locate apphost binary from pass 1
      run: |
        # 在 native corehost 构建产物里找 32 位 ELF 的 apphost 文件。
        found=""
        while IFS= read -r f; do
          if file "$f" | grep -q "ELF 32-bit"; then
            found="$f"
            break
          fi
        done < <(find ${{ github.workspace }}/dotnet/src/runtime/artifacts -type f -name 'apphost' 2>/dev/null)

        if [ -z "$found" ]; then
          echo "::error::未找到 32-bit ELF 的 apphost 二进制。可能第一趟构建在生成 apphost 之前就失败了（比如 CMake/编译阶段本身出错），需要先看 pass 1 日志排查，而不是继续走本流程。"
          echo "artifacts 下所有名为 apphost* 的文件："
          find ${{ github.workspace }}/dotnet/src/runtime/artifacts -iname 'apphost*' 2>/dev/null || true
          exit 1
        fi

        echo "Found apphost: $found"
        file "$found"
        mkdir -p ${{ github.workspace }}/apphost-pack/runtimes/linux-x86/native
        cp "$found" ${{ github.workspace }}/apphost-pack/runtimes/linux-x86/native/apphost
        chmod +x ${{ github.workspace }}/apphost-pack/runtimes/linux-x86/native/apphost

    - name: Determine expected AppHost package version
      id: apphost_ver
      run: |
        version="${{ inputs.apphost_version }}"

        if [ -z "$version" ]; then
          echo "未手动指定版本号，改用更可靠的方式：直接从本次构建自己产出的 Shipping nupkg 文件名提取版本号"
          echo "（同一次构建产出的所有包共享同一个产品版本号，这个版本号就是 AppHost 包也应该用的版本号，"
          echo "  不需要去猜 msbuild 内部属性名，也不需要去查 NuGet.org 上 linux-x64 的版本，直接用自己构建出的即可）"

          shipping_dir="${{ github.workspace }}/dotnet/artifacts/packages/Release/Shipping"

          # 优先找同 RID 的 runtime 包（如果这次构建有产出的话），版本号最贴合目标场景
          sample_pkg=$(find "$shipping_dir" -iname 'Microsoft.NETCore.App.Runtime.linux-x86.*.nupkg' 2>/dev/null | head -n1)

          # 找不到就退而求其次，随便挑一个已知稳定命名、不含 RID 后缀歧义的包（例如 System.Text.Json）
          if [ -z "$sample_pkg" ]; then
            sample_pkg=$(find "$shipping_dir" -iname 'System.Text.Json.*.nupkg' ! -iname '*.symbols.nupkg' 2>/dev/null | head -n1)
          fi

          # 再兜底：随便找一个 Shipping 目录下的 nupkg
          if [ -z "$sample_pkg" ]; then
            sample_pkg=$(find "$shipping_dir" -iname '*.nupkg' ! -iname '*.symbols.nupkg' 2>/dev/null | head -n1)
          fi

          if [ -n "$sample_pkg" ]; then
            echo "参考包: $sample_pkg"
            filename=$(basename "$sample_pkg" .nupkg)
            # 从文件名末尾提取版本号：形如 Name.1.2.3 或 Name.1.2.3-servicing.xxxx.xx
            version=$(echo "$filename" | grep -o -E '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$')
          else
            echo "::warning::在 $shipping_dir 下没有找到任何 Shipping nupkg，可能第一趟构建在产出这些包之前就失败了"
          fi
        fi

        if [ -z "$version" ]; then
          echo "::error::无法确定 Microsoft.NETCore.App.Host.linux-x86 应使用的版本号。"
          echo "请手动做以下任一操作后通过 apphost_version 输入参数重跑："
          echo "  1) 查看 ${{ github.workspace }}/dotnet/artifacts/packages/Release/Shipping/ 目录下任意一个 nupkg 的文件名，把末尾的版本号抄出来；"
          echo "  2) 或者去 https://www.nuget.org/packages/Microsoft.NETCore.App.Host.linux-x64 查这次要构建的 .NET 版本对应的号码（仅作参考，最好还是用第 1 条实测的版本号）。"
          exit 1
        fi

        echo "Using AppHost package version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Pack Microsoft.NETCore.App.Host.linux-x86
      run: |
        cat > ${{ github.workspace }}/apphost-pack/pack.csproj << EOF
        <Project Sdk="Microsoft.Build.NoTargets/3.7.56">
          <PropertyGroup>
            <TargetFramework>net10.0</TargetFramework>
            <PackageId>Microsoft.NETCore.App.Host.linux-x86</PackageId>
            <Version>${{ steps.apphost_ver.outputs.version }}</Version>
            <IsPackable>true</IsPackable>
            <NoWarn>\$(NoWarn);NU5128;NU5100</NoWarn>
          </PropertyGroup>
          <ItemGroup>
            <None Include="runtimes/linux-x86/native/apphost" Pack="true" PackagePath="runtimes/linux-x86/native/apphost" />
          </ItemGroup>
        </Project>
        EOF

        cd ${{ github.workspace }}/apphost-pack
        dotnet pack pack.csproj -c Release -o out
        cp out/*.nupkg ${{ github.workspace }}/local-feed/
        echo "本地 feed 目录内容："
        ls -la ${{ github.workspace }}/local-feed/

    - name: Upload AppHost pack (可用于日后编译 v2rayN 等自包含发布)
      uses: actions/upload-artifact@v4
      with:
        name: Microsoft.NETCore.App.Host.linux-x86-nupkg
        path: ${{ github.workspace }}/apphost-pack/out/*.nupkg

    - name: Build (pass 2 - 本地 feed 已就绪，不再需要 UseAppHost=false)
      run: |
        docker run --platform linux/amd64 --rm \
          -v ${{ github.workspace }}/dotnet:/dotnet \
          -v ${{ github.workspace }}/local-feed:/dotnet-local-feed \
          -w /dotnet \
          -e ROOTFS_DIR=/crossrootfs/x86 \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e MSBUILDDISABLENODEREUSE=1 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            ./build.sh --clean-while-building --prep -sb \
              --os ${{ matrix.name }} \
              --rid ${{ matrix.name }}-x86 \
              --arch x86 \
              --branding ${{ inputs.branding }} \
              -p:OfficialBuildId=$(date +%Y%m%d).99 \
              -p:MaxCpuCount=3

    # 无论构建成功还是失败/中断，都打印内核 OOM 日志和内存状态
    - name: Check OOM & System Logs
      if: always()
      run: |
        echo "=== Final Memory Status ==="
        free -h
        echo "=== Kernel OOM Killer Logs ==="
        sudo dmesg -T | grep -i -E "oom|killed" || echo "No OOM events found in kernel log."

    - name: List assets directory
      run: |
        find "${{ github.workspace }}/dotnet/artifacts"

    - name: Upload .NET
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-sdk-${{ matrix.name }}
        path: |
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ inputs.release }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Make release
      run: |
        sudo apt install -y hub

        git clone https://${{ secrets.CLONE_TOKEN }}:x-oauth-basic@github.com/${{ github.repository }}.git repo
        cd repo

        sdk_paths=$(find ${{ github.workspace }}/artifacts -name 'dotnet-sdk-*.tar.gz')
        artifacts=""
        for sdk_path in $sdk_paths; do
          sdk_filename=$(basename "$sdk_path")
          sdk_version=$(echo "$sdk_filename" | sed -E 's/dotnet-sdk-([^-]+(-[^-]+)*)-linux-.+\.tar\.gz/\1/')
          artifacts="$artifacts -a $sdk_path"
          tag_name="$sdk_version"
        done

        echo "tag_name: $tag_name"
        echo "artifacts: $artifacts"

        hub release create $artifacts --prerelease -m "$tag_name" "$tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
