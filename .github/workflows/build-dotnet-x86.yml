name: Build .NET SDK (linux-x86)
on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet
      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main
      branding:
        description: 'SDK branding'
        required: true
        type: choice
        options:
          - unstable
          - preview
          - release
        default: preview
      release:
        description: 'publish release'
        type: boolean
jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux
            libc: glibc
            docker_tag: azurelinux-3.0-net10.0-cross-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Show workflow inputs
      run: |
        echo "Workflow inputs:"
        echo "fork: ${{ inputs.fork }}"
        echo "branch: ${{ inputs.branch }}"
        echo "branding: ${{ inputs.branding }}"
        echo "release: ${{ inputs.release }}"
    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'
    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    - name: Prepare local NuGet feed for AppHost pack
      run: |
        # 建一个空的本地 feed 目录，第一次构建时它是空的（不影响，反正第一次本来就预期在
        # AppHost restore 处失败），第二次构建前会把打好的 apphost nupkg 放进来。
        #
        # 注意：这里不再修改 dotnet/NuGet.config！实测发现，哪怕只是往这份文件里插入一行
        # 内容（不管插在 <clear /> 前面还是后面），都会导致构建表现得像是被允许做了一次
        # 不受限的公网 restore，引发大量 NU1202（包版本与 netstandard2.0 不兼容）错误——
        # 说明 VMR 的 source-build 流程可能依赖这份文件的原始内容做某种校验，一旦被改动
        # 就会触发完全不同（且错误）的构建分支。
        #
        # 改用 MSBuild 的 RestoreAdditionalProjectSources 属性在命令行里追加一个额外的
        # restore 源，完全不触碰任何配置文件，从源头避开这个未知的连锁反应。
        mkdir -p ${{ github.workspace }}/local-feed
        echo "本地 feed 目录已创建：${{ github.workspace }}/local-feed（容器内路径 /dotnet-local-feed）"

    - name: Build & locate apphost binary (第一次构建预期在 AppHost restore 处失败，构建本身产出的 apphost 二进制和 Shipping 包不受影响)
      run: |
        docker run --platform linux/amd64 --rm \
          -v ${{ github.workspace }}/dotnet:/dotnet \
          -v ${{ github.workspace }}/local-feed:/dotnet-local-feed \
          -w /dotnet \
          -e ROOTFS_DIR=/crossrootfs/x86 \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e MSBUILDDISABLENODEREUSE=1 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            ./build.sh --clean-while-building --prep -sb \
              --os ${{ matrix.name }} \
              --rid ${{ matrix.name }}-x86 \
              --arch x86 \
              --branding ${{ inputs.branding }} \
              -p:OfficialBuildId=$(date +%Y%m%d).99 \
              -p:MaxCpuCount=3 \
              -p:RestoreAdditionalProjectSources=/dotnet-local-feed \
        || echo "构建按预期在 AppHost restore 处失败（如果是其他原因失败，下面找不到 apphost 二进制时会报错并停止）"

        # 在 native corehost 构建产物里找 32 位 ELF 的 apphost 文件。
        found=""
        while IFS= read -r f; do
          if file "$f" | grep -q "ELF 32-bit"; then
            found="$f"
            break
          fi
        done < <(find ${{ github.workspace }}/dotnet/src/runtime/artifacts -type f -name 'apphost' 2>/dev/null)

        if [ -z "$found" ]; then
          echo "::error::未找到 32-bit ELF 的 apphost 二进制。可能构建在生成 apphost 之前就失败了（比如 CMake/编译阶段本身出错），需要先看上面的构建日志排查，而不是继续走本流程。"
          echo "artifacts 下所有名为 apphost* 的文件："
          find ${{ github.workspace }}/dotnet/src/runtime/artifacts -iname 'apphost*' 2>/dev/null || true
          exit 1
        fi

        echo "Found apphost: $found"
        file "$found"
        mkdir -p ${{ github.workspace }}/apphost-pack/runtimes/linux-x86/native
        cp "$found" ${{ github.workspace }}/apphost-pack/runtimes/linux-x86/native/apphost
        chmod +x ${{ github.workspace }}/apphost-pack/runtimes/linux-x86/native/apphost

    - name: Determine expected AppHost package version (从本次构建自己产出的 Shipping 包文件名提取)
      id: apphost_ver
      run: |
        # 同一次构建产出的所有 Shipping 包共享同一个产品版本号（实测确认为形如 10.0.10 这种
        # 不带 servicing 后缀的格式），这个版本号就是 AppHost 包也应该使用的版本号。
        shipping_dir="${{ github.workspace }}/dotnet/src/runtime/artifacts/packages/Release/Shipping"

        sample_pkg=$(find "$shipping_dir" -iname 'System.Text.Json.*.nupkg' ! -iname '*.symbols.nupkg' 2>/dev/null | head -n1)

        if [ -z "$sample_pkg" ]; then
          echo "::warning::未找到 System.Text.Json 参考包，退而求其次随便挑一个 Shipping 包"
          sample_pkg=$(find "$shipping_dir" -iname '*.nupkg' ! -iname '*.symbols.nupkg' 2>/dev/null | head -n1)
        fi

        if [ -z "$sample_pkg" ]; then
          echo "::error::在 $shipping_dir 下没有找到任何 Shipping nupkg，可能构建在产出这些包之前就失败了"
          exit 1
        fi

        echo "参考包: $sample_pkg"
        filename=$(basename "$sample_pkg" .nupkg)
        # 从文件名末尾提取版本号：形如 Name.1.2.3
        version=$(echo "$filename" | grep -o -E '[0-9]+\.[0-9]+\.[0-9]+$')

        if [ -z "$version" ]; then
          echo "::error::未能从文件名 $filename 中提取出版本号"
          exit 1
        fi

        echo "Using AppHost package version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install temporary dotnet SDK on host (for packing only)
      run: |
        # 前面 "Maximize build space" 把 host 上预装的 dotnet 删掉了，这里临时装一个
        # 最小 SDK 到 host，专门给下一步 "dotnet pack" 用，跟容器内构建用的 dotnet 互不影响。
        curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --channel 10.0 --install-dir ${{ github.workspace }}/host-dotnet --no-path
        echo "${{ github.workspace }}/host-dotnet" >> "$GITHUB_PATH"
        echo "临时 host dotnet 安装完成："
        ${{ github.workspace }}/host-dotnet/dotnet --info

    - name: Pack Microsoft.NETCore.App.Host.linux-x86
      run: |
        cat > ${{ github.workspace }}/apphost-pack/pack.csproj << EOF
        <Project Sdk="Microsoft.Build.NoTargets/3.7.56">
          <PropertyGroup>
            <TargetFramework>net10.0</TargetFramework>
            <PackageId>Microsoft.NETCore.App.Host.linux-x86</PackageId>
            <Version>${{ steps.apphost_ver.outputs.version }}</Version>
            <IsPackable>true</IsPackable>
            <NoWarn>\$(NoWarn);NU5128;NU5100</NoWarn>
          </PropertyGroup>
          <ItemGroup>
            <None Include="runtimes/linux-x86/native/apphost" Pack="true" PackagePath="runtimes/linux-x86/native/apphost" />
          </ItemGroup>
        </Project>
        EOF

        cd ${{ github.workspace }}/apphost-pack
        dotnet pack pack.csproj -c Release -o out
        cp out/*.nupkg ${{ github.workspace }}/local-feed/
        echo "本地 feed 目录内容："
        ls -la ${{ github.workspace }}/local-feed/

    - name: Upload AppHost pack (可用于日后编译 v2rayN 等自包含发布)
      uses: actions/upload-artifact@v4
      with:
        name: Microsoft.NETCore.App.Host.linux-x86-nupkg
        path: ${{ github.workspace }}/apphost-pack/out/*.nupkg

    - name: Re-clone fresh repository for final build (避免复用第一次构建残留的缓存导致版本解析不一致)
      run: |
        # 实测发现：两趟构建如果共用同一个 /dotnet 目录，第二趟会复用第一趟残留的
        # prereqs/packages/archive 缓存（日志里能看到 "...it will not be downloaded"），
        # 但 --clean-while-building 只清理了 build 自身的 artifacts，不会清理这类底层缓存，
        # 导致第二趟 restore 解析出版本不一致（大量 NU1202）。VMR 的 source-build 流程设计
        # 假设每次容器运行只做一次干净构建，我们的两趟构建结构不满足这个假设。
        # 解决办法：整个删掉第一趟用过的 dotnet 目录，重新完整 clone 一份全新的，
        # 保证第二趟构建的起点跟第一趟一样干净。
        # docker 容器内部是以 root 身份跑的（没加 --user 参数），第一趟构建在挂载的
        # /dotnet 目录里创建了大量 root 属主的文件，普通 rm -rf（runner 用户）删不掉，
        # 会报 Permission denied 并导致这一步失败，需要 sudo 才能删干净。
        rm -rf ${{ github.workspace }}/dotnet 2>/dev/null || sudo rm -rf ${{ github.workspace }}/dotnet
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet ${{ github.workspace }}/dotnet

    - name: Build (本地 feed 已就绪，重新完整构建一次)
      run: |
        docker run --platform linux/amd64 --rm \
          -v ${{ github.workspace }}/dotnet:/dotnet \
          -v ${{ github.workspace }}/local-feed:/dotnet-local-feed \
          -w /dotnet \
          -e ROOTFS_DIR=/crossrootfs/x86 \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
          -e MSBUILDDISABLENODEREUSE=1 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            ./build.sh --clean-while-building --prep -sb \
              --os ${{ matrix.name }} \
              --rid ${{ matrix.name }}-x86 \
              --arch x86 \
              --branding ${{ inputs.branding }} \
              -p:OfficialBuildId=$(date +%Y%m%d).99 \
              -p:MaxCpuCount=3 \
              -p:RestoreAdditionalProjectSources=/dotnet-local-feed

    # 无论构建成功还是失败/中断，都打印内核 OOM 日志和内存状态
    - name: Check OOM & System Logs
      if: always()
      run: |
        echo "=== Final Memory Status ==="
        free -h
        echo "=== Kernel OOM Killer Logs ==="
        sudo dmesg -T | grep -i -E "oom|killed" || echo "No OOM events found in kernel log."
    - name: List assets directory
      run: |
        find "${{ github.workspace }}/dotnet/artifacts"
    - name: Upload .NET
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-sdk-${{ matrix.name }}
        path: |
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ inputs.release }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Make release
      run: |
        sudo apt install -y hub
        git clone https://${{ secrets.CLONE_TOKEN }}:x-oauth-basic@github.com/${{ github.repository }}.git repo
        cd repo
        sdk_paths=$(find ${{ github.workspace }}/artifacts -name 'dotnet-sdk-*.tar.gz')
        artifacts=""
        for sdk_path in $sdk_paths; do
          sdk_filename=$(basename "$sdk_path")
          sdk_version=$(echo "$sdk_filename" | sed -E 's/dotnet-sdk-([^-]+(-[^-]+)*)-linux-.+\.tar\.gz/\1/')
          artifacts="$artifacts -a $sdk_path"
          tag_name="$sdk_version"
        done
        echo "tag_name: $tag_name"
        echo "artifacts: $artifacts"
        hub release create $artifacts --prerelease -m "$tag_name" "$tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
