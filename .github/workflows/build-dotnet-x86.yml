name: Build .NET SDK (linux-x86)

on:
  workflow_dispatch:
    inputs:
      fork:
        description: 'dotnet VMR fork name'
        required: true
        type: string
        default: dotnet
      branch:
        description: 'dotnet VMR branch name'
        required: true
        type: string
        default: main
      branding:
        description: 'SDK branding'
        required: true
        type: choice
        options:
          - unstable
          - preview
          - release
        default: preview
      release:
        description: 'publish release'
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux
            libc: glibc
            docker_tag: azurelinux-3.0-net10.0-cross-x86
          # 如果需要 musl 版本，musl 官方对 x86(32位) 的支持较少，
          # 请先在 mcr.microsoft.com/dotnet-buildtools/prereqs 确认是否存在对应 tag，
          # 例如 azurelinux-3.0-net10.0-cross-x86-musl，确认存在后再取消注释：
          # - name: linux-musl
          #   libc: musl
          #   docker_tag: azurelinux-3.0-net10.0-cross-x86-musl
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Show workflow inputs
      run: |
        echo "Workflow inputs:"
        echo "fork: ${{ inputs.fork }}"
        echo "branch: ${{ inputs.branch }}"
        echo "branding: ${{ inputs.branding }}"
        echo "release: ${{ inputs.release }}"

    - name: Maximize build space
      uses: AdityaGarg8/remove-unwanted-software@v4.1
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-cached-tools: 'true'

    - name: Clone repository
      run: |
        git clone --single-branch --depth 1 -b ${{ inputs.branch }} https://github.com/${{ inputs.fork }}/dotnet

    # 注意：原 riscv64 workflow 里的两个补丁（TLS 优化关闭 & march/mabi pin）
    # 都是 riscv64 专属问题（linux-musl-riscv64 的 initial-exec TLS 兼容性,
    # 以及 riscv64 编译器基线漂移），x86 不存在这些问题，因此这里不需要打补丁。
    # 如果之后 x86 构建过程中遇到类似的架构专属编译错误，可以在这里按需添加对应补丁。

    - name: Build
      run: |
        docker run --platform linux/amd64 --rm -v${{ github.workspace }}/dotnet:/dotnet -w /dotnet -e ROOTFS_DIR=/crossrootfs/x86 \
          mcr.microsoft.com/dotnet-buildtools/prereqs:${{ matrix.docker_tag }} \
            ./build.sh --clean-while-building --prep -sb --os ${{ matrix.name }} --rid ${{ matrix.name }}-x86 \
              --arch x86 --branding ${{ inputs.branding }} -p:OfficialBuildId=$(date +%Y%m%d).99

    - name: List assets directory
      run: |
        find "${{ github.workspace }}/dotnet/artifacts"

    - name: Upload .NET
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-sdk-${{ matrix.name }}
        path: |
          ${{ github.workspace }}/dotnet/artifacts/assets/Release/Sdk/*/dotnet-sdk-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ inputs.release }}
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Make release
      run: |
        sudo apt install -y hub

        # hub(1) requires release to be created inside a git repo
        git clone https://${{ secrets.CLONE_TOKEN }}:x-oauth-basic@github.com/${{ github.repository }}.git repo
        cd repo

        sdk_paths=$(find ${{ github.workspace }}/artifacts -name 'dotnet-sdk-*.tar.gz')
        artifacts=""
        for sdk_path in $sdk_paths; do
          sdk_filename=$(basename "$sdk_path")
          # Extract version: strip prefix/suffix to get e.g. "10.0.100-preview.5.25277.114"
          sdk_version=$(echo "$sdk_filename" | sed -E 's/dotnet-sdk-([^-]+(-[^-]+)*)-linux-.+\.tar\.gz/\1/')
          artifacts="$artifacts -a $sdk_path"
          tag_name="$sdk_version"
        done

        echo "tag_name: $tag_name"
        echo "artifacts: $artifacts"

        # docs: https://hub.github.com/hub-release.1.html
        hub release create $artifacts --prerelease -m "$tag_name" "$tag_name"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
